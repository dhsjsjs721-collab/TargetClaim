name: Build TalismanForge JAR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TalismanForge/**"
      - ".github/workflows/talismanforge-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p TalismanForge build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TalismanForge-JAR
          path: TalismanForge/build/libs/*.jar
