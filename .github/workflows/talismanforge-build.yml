name: Build TalismanForge JAR
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "TalismanForge/**"
      - "src/main/java/dev/targetclaim/TargetClaimPlugin.java"
      - "resourcepacks/TalismanForge-2.0.0-ResourcePack.zip"
      - ".github/workflows/talismanforge-build.yml"
  push:
    branches: [main]
    paths:
      - "TalismanForge/**"
      - ".github/workflows/talismanforge-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p TalismanForge build --no-daemon
      - run: gradle build --no-daemon
      - name: Verify shared resource pack
        run: |
          python -m zipfile -t resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          test "$(sha1sum resourcepacks/TalismanForge-2.0.0-ResourcePack.zip | cut -d ' ' -f 1)" = "$(cat resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1)"
      - uses: actions/upload-artifact@v4
        with:
          name: TalismanForge-JAR
          path: TalismanForge/build/libs/*.jar
