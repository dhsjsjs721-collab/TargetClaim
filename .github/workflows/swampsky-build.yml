name: Build SwampSky JAR and ResourcePack
on:
  workflow_dispatch:
  push:
    branches: [main, feature/swampsky-creatures]
    paths:
      - "SwampSky/**"
      - ".github/workflows/swampsky-build.yml"
  pull_request:
    paths:
      - "SwampSky/**"
      - ".github/workflows/swampsky-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p SwampSky build --no-daemon
      - run: python3 -m pip install --disable-pip-version-check Pillow
      - run: python3 SwampSky/tools/build_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: SwampSky-Plugin-JAR
          path: SwampSky/build/libs/SwampSky-1.1.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: SwampSky-ResourcePack
          path: SwampSky/build/SwampSky-ResourcePack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TalismanForge-SwampSky-Combined-Pack
          path: SwampSky/build/TalismanForge-SwampSky-Combined.zip
