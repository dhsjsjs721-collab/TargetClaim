name: Build UnifiedProtection JAR
on:
  push:
    branches: [main]
    paths:
      - 'UnifiedProtection/**'
      - '.github/workflows/build-unified-protection.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnifiedProtection
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and capture diagnostics
        id: build
        shell: bash
        run: |
          set +e
          gradle clean build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish verified binary or failure report
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            cp build/libs/UnifiedProtection-1.0.0.jar dist/
            echo "SUCCESS: UnifiedProtection-1.0.0.jar compiled on $(date -u +%F)" > ci-status.txt
          else
            echo "FAILED: Gradle exit ${{ steps.build.outputs.exit_code }}" > ci-status.txt
            grep -E -A 5 -B 3 'error:|FAILURE:|Could not |What went wrong|Exception' build.log | head -c 24000 >> ci-status.txt || true
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedProtection/ci-status.txt UnifiedProtection/dist/
          git diff --cached --quiet || git commit -m "Publish UnifiedProtection CI results [skip ci]"
          git push origin HEAD:main
      - name: Upload JAR
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedProtection-JAR
          path: UnifiedProtection/build/libs/*.jar
          if-no-files-found: error
      - name: Mark compile failure
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
