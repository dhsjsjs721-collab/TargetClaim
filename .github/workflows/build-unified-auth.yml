name: Build UnifiedAuth JAR
on:
  push:
    branches: [main, unified-auth-1-4-no-registration-loop]
    paths:
      - 'UnifiedAuth/**'
      - '.github/workflows/build-unified-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnifiedAuth
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build and capture errors
        id: compile
        shell: bash
        run: |
          set +e
          gradle clean build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload JAR
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedAuth-JAR
          path: UnifiedAuth/build/libs/*.jar
          if-no-files-found: error
      - name: Mark failed build
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
