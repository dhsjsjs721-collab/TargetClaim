name: Integrate SwampSky assets into unified pack
on:
  push:
    branches: [main]
    paths:
      - "tools/integrate_swampsky_1_3_20261119.py"
      - ".github/workflows/integrate-resourcepack-20261119.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge only the submitted SwampSky changes
        run: python tools/integrate_swampsky_1_3_20261119.py
      - name: Replace the existing pack in place (keep public URL unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          if ! git diff --cached --quiet; then
            git commit -m "Integrate new SwampSky 1.3 assets into existing unified resource pack"
            git push origin HEAD:main
          fi
      - name: Show final SHA1
        run: sha1sum resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TalismanForge-Unified-ResourcePack
          path: resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
