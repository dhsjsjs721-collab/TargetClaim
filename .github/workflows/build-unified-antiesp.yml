name: Build UnifiedAntiESP JAR
on:
  push:
    branches: [main, unified-antiesp-build]
    paths:
      - 'UnifiedAntiESP/**'
      - '.github/workflows/build-unified-antiesp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'UnifiedAntiESP/**'
      - '.github/workflows/build-unified-antiesp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnifiedAntiESP
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build UnifiedAntiESP
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload UnifiedAntiESP JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedAntiESP-JAR
          path: UnifiedAntiESP/build/libs/*.jar
          if-no-files-found: error
