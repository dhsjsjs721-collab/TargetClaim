name: Build UnifiedAntiESP JAR
on:
  push:
    branches: [main]
    paths:
      - 'UnifiedAntiESP/**'
      - '.github/workflows/build-unified-antiesp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnifiedAntiESP
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile plugin and collect errors
        id: build
        shell: bash
        run: |
          set +e
          gradle clean build --no-daemon --stacktrace > build.log 2>&1
          code=$?
          cat build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish JAR or failure report to repository
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            cp build/libs/UnifiedAntiESP-3.4.0.jar dist/
            echo "SUCCESS: UnifiedAntiESP-3.4.0.jar built on $(date -u +%F)" > ci-status.txt
          else
            echo "FAILED: Gradle exit ${{ steps.build.outputs.exit_code }}" > ci-status.txt
            grep -E -A 5 -B 3 'error:|FAILURE:|Could not |What went wrong|Exception' build.log | head -c 24000 >> ci-status.txt || true
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnifiedAntiESP/ci-status.txt UnifiedAntiESP/dist/
          git diff --cached --quiet || git commit -m "Publish UnifiedAntiESP build results [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload JAR artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedAntiESP-JAR
          path: UnifiedAntiESP/build/libs/*.jar
          if-no-files-found: error
      - name: Mark compilation failure
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
