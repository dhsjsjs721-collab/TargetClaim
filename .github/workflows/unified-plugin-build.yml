name: Build single unified Minecraft plugin
on:
  workflow_dispatch:
  push:
    branches: [feature/unified-server-plugin]
    paths:
      - 'UnifiedPlugin/**'
      - '.github/workflows/unified-plugin-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fetch newest source from maintained branches
        run: |
          git fetch origin main talismanforge-v2 feature/enchantmentforge-soulbound-triple-shot feature/swampsky-creatures
          git branch -r
      - name: Convert each legacy JavaPlugin to a hosted module
        run: python3 UnifiedPlugin/tools/generate_modules.py
      - name: Compile one fully-integrated plugin JAR
        run: gradle -p UnifiedPlugin build --no-daemon
      - name: Package one JAR with current unified resource pack
        run: |
          mkdir -p dist/plugins dist/resourcepacks
          cp UnifiedPlugin/build/libs/MinecraftUnified-1.1.12.jar dist/plugins/
          git show f86361fbca758522a5cfa7a07652c7e044263fb3:resourcepacks/TalismanForge-2.0.0-ResourcePack.zip > dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          git show f86361fbca758522a5cfa7a07652c7e044263fb3:resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1 > dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1
          python -m zipfile -t dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          test "$(sha1sum dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip | cut -d ' ' -f 1)" = "$(cat dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1)"
          python -c "import zipfile; z=zipfile.ZipFile('UnifiedPlugin/build/libs/MinecraftUnified-1.1.12.jar'); assert 'dev/talismanforge/MythicTalismans.class' in z.namelist(); assert not any('FiveTalismanService' in n or 'CombatShields' in n for n in z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-1.1.12-Full
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-1.1.12-JAR
          path: UnifiedPlugin/build/libs/MinecraftUnified-1.1.12.jar
      - name: Start real Purpur 26.3 and verify all modules
        run: python3 UnifiedPlugin/tools/smoke_purpur.py
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-One-JAR
          path: UnifiedPlugin/build/libs/MinecraftUnified-1.1.12.jar
