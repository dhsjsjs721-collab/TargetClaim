name: Build single unified Minecraft plugin
on:
  workflow_dispatch:
  push:
    branches: [feature/unified-server-plugin, fix/unified-gameplay-20261127]
    paths:
      - 'UnifiedPlugin/**'
      - 'resourcepacks/**'
      - '.github/workflows/unified-plugin-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fetch newest source from maintained branches
        run: |
          git fetch origin main talismanforge-v2 feature/enchantmentforge-soulbound-triple-shot feature/swampsky-creatures
          git branch -r
      - name: Convert each legacy JavaPlugin to a hosted module
        run: python3 UnifiedPlugin/tools/generate_modules.py
      - name: Compile one fully-integrated plugin JAR
        run: gradle -p UnifiedPlugin build --no-daemon
      - name: Validate all resource-pack references
        run: python3 UnifiedPlugin/tools/audit_pack.py
      - name: Package one JAR with current unified resource pack
        run: |
          mkdir -p dist/plugins dist/resourcepacks
          cp UnifiedPlugin/build/libs/MinecraftUnified-1.1.22.jar dist/plugins/
          cat resourcepacks/TalismanForge-2.0.0-ResourcePack.zip > dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          cat resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1 > dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1
          python -m zipfile -t dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip
          test "$(sha1sum dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.zip | cut -d ' ' -f 1)" = "$(cat dist/resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1)"
          python -c "import zipfile; z=zipfile.ZipFile('UnifiedPlugin/build/libs/MinecraftUnified-1.1.22.jar'); assert 'dev/talismanforge/MythicTalismans.class' in z.namelist(); assert not any('FiveTalismanService' in n or 'CombatShields' in n for n in z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-1.1.22-Full
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-1.1.22-JAR
          path: UnifiedPlugin/build/libs/MinecraftUnified-1.1.22.jar
      - name: Export complete unified source
        run: |
          mkdir -p dist-source/UnifiedPlugin/src/main/java dist-source/UnifiedPlugin/src/main/resources
          cp -a UnifiedPlugin/src/main/java/. dist-source/UnifiedPlugin/src/main/java/
          cp -a UnifiedPlugin/build/generated-sources/. dist-source/UnifiedPlugin/src/main/java/
          cp -a UnifiedPlugin/src/main/resources/. dist-source/UnifiedPlugin/src/main/resources/
          cp -a UnifiedPlugin/build/generated-resources/. dist-source/UnifiedPlugin/src/main/resources/
          cp UnifiedPlugin/build.gradle.kts UnifiedPlugin/settings.gradle.kts UnifiedPlugin/README.md dist-source/UnifiedPlugin/
          cp -a dist/resourcepacks dist-source/
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-1.1.22-Source
          path: dist-source/
      - name: Start real Purpur 26.3 and verify all modules
        run: python3 UnifiedPlugin/tools/smoke_purpur.py
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftUnified-One-JAR
          path: UnifiedPlugin/build/libs/MinecraftUnified-1.1.22.jar
