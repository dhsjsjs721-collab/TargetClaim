name: Build ImageMaps JAR
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ImageMaps/**'
      - '.github/workflows/imagemaps-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build ImageMaps
        run: gradle -p ImageMaps build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ImageMaps-JAR
          path: ImageMaps/build/libs/*.jar
