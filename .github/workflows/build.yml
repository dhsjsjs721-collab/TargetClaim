name: Build plugin JAR
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode initial source payload
        shell: bash
        run: |
          if [ -f payload/TargetClaimPlugin.java.xz.b64 ]; then
            mkdir -p src/main/java/dev/targetclaim
            base64 -d payload/TargetClaimPlugin.java.xz.b64 | xz -d > src/main/java/dev/targetclaim/TargetClaimPlugin.java
            rm payload/TargetClaimPlugin.java.xz.b64
            rmdir payload || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand TargetClaim Java source [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TargetClaim-JAR
          path: build/libs/*.jar
