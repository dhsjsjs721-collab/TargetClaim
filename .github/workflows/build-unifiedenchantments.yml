name: Build UnifiedEnchantments JAR
on:
  push:
    branches: [main]
    paths:
      - 'UnifiedEnchantments/**'
      - '.github/workflows/build-unifiedenchantments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UnifiedEnchantments
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and run unit tests
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnifiedEnchantments-JAR
          path: UnifiedEnchantments/build/libs/UnifiedEnchantments-1.0.0.jar
          if-no-files-found: error
