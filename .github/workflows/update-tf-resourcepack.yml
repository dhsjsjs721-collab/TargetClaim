name: Update TalismanForge resource pack
on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-talismanforge-pack.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert grappling-hook texture into the existing resource-pack ZIP
        run: python scripts/patch-talismanforge-pack.py
      - name: Publish updated pack at original URL
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resourcepacks/TalismanForge-2.0.0-ResourcePack.zip resourcepacks/TalismanForge-2.0.0-ResourcePack.sha1
          git diff --cached --quiet && exit 0
          git commit -m "Update TalismanForge 2.4 resource pack in place [skip ci]"
          git push origin HEAD:main
