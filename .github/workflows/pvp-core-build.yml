name: PvP Core Build
on:
  push:
    branches: [pvp-core]
    paths:
      - 'pvp-core/**'
      - '.github/workflows/pvp-core-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash pvp-core/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pvp-core
          path: pvp-core/build/pvp-core-0.2.jar
          if-no-files-found: error
