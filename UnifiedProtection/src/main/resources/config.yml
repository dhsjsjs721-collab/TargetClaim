# Never deletes player items. Suspicious transactions are rejected, not destroyed.
inventory-guard:
  enabled: true
  reject-overstacked-transactions: true
  validate-hopper-transfers: false
  validate-hopper-pickups: false
  # Per-player maximum inventory clicks/second. Cancels only traffic above this limit.
  clicks-per-second-limit: 240
  enforce-click-rate-limit: true
  log-violations: true
portal-guard:
  block-falling-block-portals: true
  block-storage-vehicle-portals: false
paper-settings-audit:
  enabled: true
  # Reports, does not edit paper-global.yml
  warn-cancelled-container-break: false
maintenance:
  cleanup-period-ticks: 1200
