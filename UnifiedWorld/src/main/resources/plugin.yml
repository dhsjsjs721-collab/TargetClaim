name: UnifiedWorld
version: 1.0.0
main: dev.unified.world.UnifiedWorld
api-version: '26.3'
load: POSTWORLD
description: Manual cancellable bounded world pregen and worldborder
commands:
  uworld:
    description: World diagnostics, async pregeneration and borders
    usage: /uworld [status|pregen <radiusChunks> [world]|cancel|border <radiusBlocks> [world]]
    permission: unifiedworld.admin
permissions:
  unifiedworld.admin:
    default: op
