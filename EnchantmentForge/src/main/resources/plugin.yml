name: EnchantmentForge
version: 1.0.1
main: dev.enchantmentforge.EnchantmentForgePlugin
api-version: '26.3'
author: EnchantmentForge
description: Custom Soulbound and Triple Shot enchantments
commands:
  enchantmentforge:
    description: Manage custom enchantment books
    aliases: [ce, enchants]
