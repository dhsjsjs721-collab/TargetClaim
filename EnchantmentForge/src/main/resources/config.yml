# Levels required in an anvil to apply the special book
soulbound-anvil-cost: 8
triple-shot-anvil-cost: 6
# Horizontal spread on either side of the central arrow, degrees (0-35)
triple-shot-spread-degrees: 10.0
# Arrow count by draw strength (0.0 = released instantly, 1.0 = fully drawn)
# Below medium: 1 arrow; medium to full: 2 arrows; full or higher: 3 arrows
triple-shot-medium-force: 0.50
triple-shot-full-force: 0.90

# Wandering trader extension (in addition to the vanilla spawn system)
trader-spawn-minutes: 25
trader-max-per-world: 2
trader-despawn-ticks: 48000
# All traders have the same complete catalog of goods, spawners, eggs and books.
# Old trader-offers-per-trader settings are ignored; every category is available.

# All other trades cost ceil(original price / 2.5) diamonds (range 2.0 to 3.0)
trader-price-divisor: 2.5
# Special fixed price for the one-use inventory-preserving charm
trader-charm-price: 5
