plugins { id 'java' }
group = 'dev.landminimap'
version = '0.1.0'
base { archivesName = 'LandMinimap-Bridge' }
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:26.3.build.+' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
