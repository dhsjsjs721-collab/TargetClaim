name: ImageMaps
version: 1.1.0
main: dev.imagemaps.ImageMapsPlugin
api-version: '26.3'
author: ImageMaps
description: Display custom images on persistent vanilla maps and item frames
commands:
  imagemap:
    description: Import a picture onto the map held in the main hand
    usage: /imagemap [help|cancel|https-url|file filename.png]
    aliases: [im]
permissions:
  imagemaps.use:
    description: Create image maps from public HTTPS image links
    default: true
  imagemaps.file:
    description: Import admin-uploaded images from the plugin uploads folder
    default: op
