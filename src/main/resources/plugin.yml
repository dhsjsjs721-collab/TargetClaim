name: TargetClaim
version: 1.5.2
main: dev.targetclaim.TargetClaimPlugin
api-version: '26.3'
author: TargetClaim
commands:
  p:
    description: Territory protection and inventory menu
    usage: /p [upgrade|border|remove|cancel|info|give|givekey]
    aliases: [claim, privat]
  team:
    description: Color teams (3 members maximum)
    usage: /team [create|invite|accept|leave|kick|disband|pvp|info|menu]
    aliases: [tc]
permissions:
  targetclaim.admin:
    description: May give claim cores; does not bypass player claim restrictions
    default: op
