# Strong Paper 26.3 Anti-Xray in the Overworld: cave-finder and ore protection.
# Do not replace the whole paper-world-defaults.yml.
# ONLY merge anticheat.anti-xray into config/paper-world-defaults.yml.
# WARNING: 'air' is CPU/bandwidth/client-FPS intensive and is not an
# absolute cave/water/lava occluder. Backup config; restart; stage test.
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 3
    hidden-blocks:
      - air
      - coal_ore
      - deepslate_coal_ore
      - copper_ore
      - deepslate_copper_ore
      - raw_copper_block
      - iron_ore
      - deepslate_iron_ore
      - raw_iron_block
      - gold_ore
      - deepslate_gold_ore
      - diamond_ore
      - deepslate_diamond_ore
      - emerald_ore
      - deepslate_emerald_ore
      - lapis_ore
      - deepslate_lapis_ore
      - redstone_ore
      - deepslate_redstone_ore
    replacement-blocks:
      - stone
      - deepslate
      - tuff
    lava-obscures: true
    max-block-height: 320
    update-radius: 2
    use-permission: false
