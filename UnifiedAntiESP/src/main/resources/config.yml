# UnifiedAntiESP 3.5 — no automatic world/chunk modification
config-version: 35
player-esp:
  enabled: true
  interval-ticks: 2
  max-pair-checks-per-pass: 120
  max-scan-microseconds: 2200
  max-protection-range-blocks: 224
  never-hide-within-blocks: 0
  visible-grace-millis: 120
  occluded-before-hide-millis: 80
  max-hidden-staleness-millis: 2000
  stationary-cache-millis: 100

entity-esp:
  enabled: true
  hide-mobs: true
  hide-dropped-items: true
  hide-decorations: true
  hide-vehicles: true
  hide-displays: true
  hide-experience-orbs: true
  hide-other-entities: false
  include-nether: true
  hide-below-y: 10000
  never-hide-within-blocks: 0
  max-protection-range-blocks: 224
  strict-distant-underground-mobs: true
  strict-distance-blocks: 40
  underground-max-skylight: 3
  interval-ticks: 5
  max-viewers-per-pass: 3
  max-entity-checks-per-pass: 180
  max-scan-microseconds: 2400
  max-hidden-per-viewer: 384
  max-tracked-entities-per-viewer: 2048
  max-cached-track-pairs: 4096
  track-decision-cache-millis: 125
  occlusion-rays: 2

seed-protection:
  enabled: true
  hide-command-from-tab: true
ore-shuffle:
  enabled: false
  include-nether: true
  secret: ''
  max-offset-blocks: 2
  max-moves-per-chunk: 24
  max-block-reads-per-chunk: 18000

chunk-safety:
  # Also overrides old 3.4 config with ore-shuffle.enabled: true
  # until an admin explicitly turns this safety switch off.
  disable-ore-worldgen: true
