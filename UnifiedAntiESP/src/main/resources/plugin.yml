name: UnifiedAntiESP
version: 3.5.0
main: dev.unified.antiesp.UnifiedAntiESP
api-version: '26.3'
load: POSTWORLD
commands:
  uesp:
    description: ESP status, Paper native Anti-Xray audit, reload
    usage: /uesp [audit|reload]
    permission: unifiedantiesp.admin
permissions:
  unifiedantiesp.admin:
    default: op
  unifiedantiesp.bypass:
    default: false
  unifiedantiesp.entitybypass:
    default: false
  unifiedantiesp.seed:
    default: op
