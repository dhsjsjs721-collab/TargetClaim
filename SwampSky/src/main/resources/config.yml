# SwampSky 1.9.1, Minecraft Java 26.3
# Flying-pig AI uses stable roam waypoints; ordinary pigs use vanilla pathfinder.
# New keys work with existing configuration files via fallback defaults
flying-chance: 0.28
mushroom-pig-chance: 0.80
# Additional pig population near players, not just vanilla pig spawns
flying-pig-spawn-chance: 0.45
mushroom-pig-spawn-chance: 0.90
flying-pig-nearby-cap: 5
# Aim for 2-3 giant frogs per 72-block loaded swamp neighborhood
swamp-giant-frog-target: 3
giant-chance: 0.80
frog-health: 60.0
frog-scale: 2.8
frog-damage: 7.0
# Mount controls: no carrot-on-a-stick required; saddle normal pigs to ride
pig-ground-ride-speed: 0.49
pig-swim-speed: 0.40
# Winged pigs have 0.5x entity scale, including their custom wing display
# Mount controls
pig-speed: 0.43
slope-multiplier: 1.45
snow-multiplier: 0.35

# Frog wing flight (blocks per tick horizontal); vanilla Elytra can go faster
frog-wings-glide-speed: 0.65
# Rain sustains a gentle ascent at this lower horizontal speed
frog-wings-rain-speed: 0.58
# Water is the only propulsion boost; fireworks are blocked
frog-wings-water-speed: 0.95

# Autonomous winged pig flight and behavior
flying-pig-speed: 0.48
# Three deliberate hits by the same player within this time provoke retaliation
pig-retaliation-hits: 3
pig-retaliation-hit-window-ticks: 240
pig-retaliation-duration-ticks: 400

# v1.9 safe riding: separate keys avoid carrying over excessively fast old values
# Legacy speeds retained for compatibility; v2 keys override these values.
pig-horse-ride-speed: 0.38
pig-horse-swim-speed: 0.26
# v1.9.1: normal saddled pigs are approximately 2.5 times faster.
# ~0.97 blocks/tick ordinary travel, sprint up to 1.14 blocks/tick.
pig-horse-ride-speed-v2: 0.97
pig-horse-swim-speed-v2: 0.64
pig-safe-flight-ride-speed: 0.29
flying-pig-safe-speed: 0.21
# Winged pigs normally stand / walk, and only take short airborne trips.
# Space ascends while mounted. Looking down + W descends, never through blocks.
