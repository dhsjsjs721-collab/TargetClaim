name: MinecraftUnified
version: 1.1.17
main: dev.unified.UnifiedPlugin
api-version: '26.3'
author: MinecraftUnified
description: All 5 Minecraft Paper gameplay systems in a single JAR
commands:
  skin:
    description: Change own Minecraft skin
    usage: /skin <nickname or texture URL>
  disc:
    description: Save YouTube link on a music disc
    usage: /disc <YouTube URL> [title]
  trap:
    description: FunTime-style temporary obsidian trap
    usage: /u trap [give <player> [amount]]
  unified:
    description: Show status of all five gameplay modules
    usage: /u
    aliases: [u]
  p:
    description: Protected claims and team menu
    usage: /u claim
  team:
    description: Clan menu and commands
    usage: /clan
    aliases: [clan, clans]
  unifiedmsg:
    description: Private message
    usage: /msg <player> <message>
    aliases: [msg, tell, w, pm]
  unifiedreply:
    description: Reply to private message
    usage: /r <message>
    aliases: [r, reply]
  talismanforge:
    description: Talismans and reliquaries
    usage: /u talisman give <player> <type>
    aliases: [tf, talismans]
  enchantmentforge:
    description: Custom enchantments and trader
    usage: /u enchant [trader|give|apply|help]
  swampsky:
    description: Giant frogs, frog equipment and legacy flying-pig cleanup
    usage: /u wildlife
  imagemap:
    description: Edit a map using an HTTPS image
    usage: /u map
permissions:
  minecraftunified.mirror.admin:
    default: op
  minecraftunified.mining.admin:
    default: op
  minecraftunified.trap.use:
    default: true
  minecraftunified.trap.admin:
    default: op
  targetclaim.admin:
    default: op
  talismanforge.admin:
    default: op
  enchantmentforge.admin:
    default: op
  swampsky.admin:
    default: op
  imagemaps.use:
    default: true
  imagemaps.file:
    default: op
