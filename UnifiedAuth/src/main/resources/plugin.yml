name: UnifiedAuth
version: 1.5.0
main: dev.unified.auth.UnifiedAuth
api-version: '26.3'
load: POSTWORLD
description: Early 4-digit PIN plus password authentication and optional IP trust
softdepend: [nLogin, OpeNLogin, AuthMe, AuthMeReloaded]
commands:
  ua:
    description: Authentication information and per-player remembered IP
    permission: unifiedauth.use
    usage: /ua remember [on|off|status] | /ua status
permissions:
  unifiedauth.use:
    default: true
  unifiedauth.admin:
    default: op
