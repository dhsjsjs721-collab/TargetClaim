# UnifiedAuth 1.6.0 — Paper 26.3 / Java 25
authentication:
  enabled: true
  pin-length: 4
  legacy-pin-length: 8
  minimum-password-length: 10
  maximum-attempts-per-connection: 3
  timeout-seconds: 120
  maximum-pending-connections: 50
  pbkdf2-iterations: 260000
antibot:
  enabled: true
  max-new-connections-per-ip-per-minute: 24
  maximum-tracked-addresses: 4000

# Network recognition only. Every login requires password AND PIN.
remember-ip:
  enabled: true
  expire-after-days: 7
welcome:
  enabled: true
  sound: true
  animation: true
branding:
  name: "Land of Losers"
  edition: "Vanilla+"
  auth-subtitle: "Твой мир. Твоя история."
  tab-header-enabled: true
  # Enable only after the auth-only bitmap font is installed and loaded.
  auth-art-enabled: false
