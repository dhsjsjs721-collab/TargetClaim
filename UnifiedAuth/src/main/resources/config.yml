authentication:
  enabled: true
  # New accounts use EXACTLY 4 digits in the PIN dialog.
  pin-length: 4
  # Older UnifiedAuth 1.0/1.1 accounts used 8-digit PINs by default;
  # old PIN is required once to upgrade the account to PIN + password.
  legacy-pin-length: 8
  minimum-password-length: 10
  maximum-attempts-per-connection: 3
  timeout-seconds: 120
  maximum-pending-connections: 50
  pbkdf2-iterations: 260000
antibot:
  enabled: true
  max-new-connections-per-ip-per-minute: 24
  maximum-tracked-addresses: 4000
# OPTIONAL, disabled by default. Player must separately opt in.
# Each trusted entry is linked to UUID + account name + IP + expiration.
# Vanilla Minecraft has no real CPU/motherboard HWID in its network packets.
remember-ip:
  enabled: false
  expire-after-days: 7
  allow-verified-proxy-offline-mode: false
messages:
  title: "UnifiedAuth"
  subtitle: "Сначала PIN (4 цифры), затем пароль"
