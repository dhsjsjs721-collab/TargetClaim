# UnifiedAuth 1.6.4 — Paper 26.3 / Java 25
authentication:
  enabled: true
  pin-length: 4
  legacy-pin-length: 8
  minimum-password-length: 10
  maximum-attempts-per-connection: 3
  timeout-seconds: 120
  maximum-pending-connections: 50
  pbkdf2-iterations: 260000
antibot:
  enabled: true
  max-new-connections-per-ip-per-minute: 24
  maximum-tracked-addresses: 4000

# Optional PIN-only login after a full login explicitly trusts this network.
# IP is not a device ID. Offline servers should leave the unsafe override off.
remember-ip:
  enabled: true
  expire-after-days: 7
  pin-only-on-trusted-network: false
  allow-offline-pin-only: false
welcome:
  enabled: true
  text: "Ты лузер. Всё, пока."
branding:
  name: "Land of Losers"
  edition: "Vanilla+"
  auth-subtitle: "Твой мир. Твоя история."
  tab-header-enabled: true
  # Enable only after the auth-only bitmap font is installed and loaded.
  auth-art-enabled: false
