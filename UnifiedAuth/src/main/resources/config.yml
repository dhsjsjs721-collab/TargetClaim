# UnifiedAuth 1.5.1 — Paper 26.3 / Java 25
authentication:
  enabled: true
  pin-length: 4
  legacy-pin-length: 8
  minimum-password-length: 10
  maximum-attempts-per-connection: 3
  timeout-seconds: 120
  maximum-pending-connections: 50
  pbkdf2-iterations: 260000
antibot:
  enabled: true
  max-new-connections-per-ip-per-minute: 24
  maximum-tracked-addresses: 4000

# The checkbox is opt-in per player. Offline accounts remember a network only,
# unless the administrator has verified secure proxy forwarding.
# An IP address is not a device ID.
remember-ip:
  enabled: true
  expire-after-days: 7
  allow-password-skip: true
  allow-verified-proxy-offline-mode: false
welcome:
  enabled: true
  sound: true
branding:
  name: "Land of Losers"
  edition: "Vanilla+"
  auth-subtitle: "Твой мир. Твоя история."
  tab-header-enabled: true
