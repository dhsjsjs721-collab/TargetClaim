# UnifiedAuth 1.3 — Paper 26.3 / Java 25
authentication:
  enabled: true
  pin-length: 4
  legacy-pin-length: 8
  minimum-password-length: 10
  maximum-attempts-per-connection: 3
  timeout-seconds: 120
  maximum-pending-connections: 50
  pbkdf2-iterations: 260000
antibot:
  enabled: true
  max-new-connections-per-ip-per-minute: 24
  maximum-tracked-addresses: 4000

# OFF by default: user needs to opt in via checkbox on successful
# PIN + password login or /ua remember on after password authentication.
# Trust never bypasses the PIN, only the password.
# Shared/public IPs are not a device ID! Real HWID is unavailable.
remember-ip:
  enabled: false
  expire-after-days: 7
  allow-verified-proxy-offline-mode: false
messages:
  title: "UnifiedAuth"
  subtitle: "PIN и пароль в одном окне"
