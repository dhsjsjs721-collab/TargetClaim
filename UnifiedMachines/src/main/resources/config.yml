# UnifiedMachines 1.0.0 for Paper 26.3 / Java 25
# No full chunk scans; never adjusts view-distance or simulation-distance.
damager:
  # Once per 20 ticks, each machine hits at most ONE nearby mob.
  # If more machines are placed than the cycle budget, the schedule rotates.
  radius-blocks: 2.5
  damage-passive-mobs: true
  max-per-player: 8
  max-total-blocks: 256
  max-blocks-processed-per-second: 96

chunk-loader:
  max-per-player: 1
  # All owners must be ONLINE to keep their loader active.
  # The plugin never creates tickets for offline owners.
  only-when-owner-online: true
  # Global cap on DISTINCT active chunk positions to protect MSPT/memory.
  max-total-active-chunks: 48
