name: UnifiedOptimizer
version: 1.1.0
main: dev.unified.optimizer.UnifiedOptimizer
api-version: '26.3'
load: POSTWORLD
description: Bounded, adaptive MSPT controller with safe world distance restoration
commands:
  uopt:
    description: View low-overhead performance metrics and adaptive distances
    usage: /uopt [status|profile|reload|pause|resume|reset]
    permission: unifiedoptimizer.admin
permissions:
  unifiedoptimizer.admin:
    default: op
