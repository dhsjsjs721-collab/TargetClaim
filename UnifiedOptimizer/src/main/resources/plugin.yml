name: UnifiedOptimizer
version: 1.0.0
main: dev.unified.optimizer.UnifiedOptimizer
api-version: '26.3'
load: POSTWORLD
description: Low-overhead adaptive view and simulation distance for Paper 26.3
commands:
  uopt:
    description: Monitor MSPT and control adaptive distances
    usage: /uopt [status|reload|pause|resume|reset]
    permission: unifiedoptimizer.admin
permissions:
  unifiedoptimizer.admin:
    default: op
