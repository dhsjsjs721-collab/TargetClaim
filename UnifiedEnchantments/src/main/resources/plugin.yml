name: UnifiedEnchantments
version: 1.0.0
main: dev.unified.enchantments.UnifiedEnchantments
api-version: '26.3'
load: POSTWORLD
description: Three crafted chance-based weapon runes with PDC and non-destructive audit
commands:
  uenchant:
    description: Rune information, admin rune grants and duplicate IDs audit
    usage: /uenchant [info|reload|audit|give <rune> [player]]
    permission: unifiedenchantments.use
permissions:
  unifiedenchantments.use:
    default: true
  unifiedenchantments.admin:
    default: op
