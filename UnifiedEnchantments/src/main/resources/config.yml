runes:
  # At most three levels per item. A rune book increases by one level.
  maximum-level: 3
  # Prevent PvP fights from gaining unexpected slowdown / fire by default.
  allow-pvp-effects: false
  vampirism:
    # level 1 = 8%, level 2 = 16%, level 3 = 24%
    chance-per-level: 0.08
    heal-per-level: 1.0
  frost:
    chance-per-level: 0.10
    duration-ticks: 60
  ember:
    chance-per-level: 0.10
    duration-ticks: 50
